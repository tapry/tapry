# Push a tag like v0.1.0 (matching package.json's version) to publish images to GHCR and a
# GitHub release with that version's CHANGELOG section.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches package.json
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$(node -p 'require("./package.json").version')" = "$version" \
            || { echo "Tag $GITHUB_REF_NAME doesn't match package.json version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "IMAGES=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: opentake-web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/web.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: OPENTAKE_VERSION=${{ env.VERSION }}
          push: true
          tags: |
            ${{ env.IMAGES }}/opentake-web:${{ env.VERSION }}
            ${{ env.IMAGES }}/opentake-web:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=AGPL-3.0-only
          cache-from: type=gha,scope=release-web
          cache-to: type=gha,scope=release-web,mode=max

      - name: opentake-caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/caddy.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGES }}/opentake-caddy:${{ env.VERSION }}
            ${{ env.IMAGES }}/opentake-caddy:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # This version's section of CHANGELOG.md, then how to install from the images.
          awk -v v="$VERSION" '/^## /{p = index($0, "## " v " ") == 1 || $0 == "## " v} p' CHANGELOG.md | tail -n +2 > notes.md
          cat >> notes.md <<NOTES

          ## Install or update with the published images

          In \`deploy/compose/.env\` (after \`./setup.sh\`, see docs/self-hosting.md):

          \`\`\`
          OPENTAKE_IMAGES=${IMAGES}
          OPENTAKE_VERSION=${VERSION}
          \`\`\`

          then \`docker compose pull && docker compose up -d --no-build\`.
          NOTES
          gh release create "$GITHUB_REF_NAME" --title "OpenTake $VERSION" --notes-file notes.md
