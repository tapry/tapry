# Tapry self-host stack. Quick start: ./setup.sh studio.example.com you@example.com && docker compose up -d
# See docs/self-hosting.md.
# DATA_NAME names where the data lives: the Compose project (so the volumes), the database and
# its user, and the bucket. setup.sh writes DATA_NAME=tapry. An install from before the rename
# to Tapry must keep DATA_NAME=opentake in .env, or it would start with empty volumes; it is
# required for that reason, never defaulted.
name: ${DATA_NAME:?DATA_NAME is missing from .env - an install made before 0.4 adds DATA_NAME=opentake, a new one runs setup.sh}

# Settings the web app and the workers share: database, storage, media tools.
x-app-env: &app-env
  DATABASE_URL: postgres://${DATA_NAME}:${POSTGRES_PASSWORD:?}@postgres:5432/${DATA_NAME}
  S3_ENDPOINT: http://seaweedfs:8333
  # Browsers upload to and download from storage directly, through Caddy.
  S3_PUBLIC_ENDPOINT: ${PUBLIC_SCHEME:-https}://s3.${DOMAIN}
  S3_REGION: us-east-1
  S3_BUCKET: ${DATA_NAME}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?}
  S3_FORCE_PATH_STYLE: "true"
  # Transcripts (whisper.cpp + model are in the image). Set WHISPER_MODEL= (empty) in .env to turn off.
  WHISPER_MODEL: ${WHISPER_MODEL-/opt/whisper/ggml-base.bin}
  WHISPER_THREADS: ${WHISPER_THREADS:-4}
  # Remove each recording's original uploads this many days after its files are ready (empty: keep).
  RAW_RETENTION_DAYS: ${RAW_RETENTION_DAYS-}
  # A "Record your own, free" link on guests' end screen and recap email; empty: none.
  GUEST_PROMO_URL: ${GUEST_PROMO_URL:-}
  # Guests can ask for an email with a link to their recording. Empty SMTP_HOST: off.
  APP_URL: ${PUBLIC_SCHEME:-https}://${DOMAIN}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_INSECURE: ${SMTP_INSECURE:-false}
  # Each account's own S3 bucket (Storage page): their secret keys are encrypted with this.
  # Empty: off. Once set, never change it.
  STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
  OWN_STORAGE_ALLOW_PRIVATE: ${OWN_STORAGE_ALLOW_PRIVATE:-false}
  # Tapry Cloud only (plans and billing, docs/cloud-billing.md). Leave off on your own server.
  TAPRY_CLOUD: ${TAPRY_CLOUD:-false}
  BILLING_PROVIDER: ${BILLING_PROVIDER:-paddle}
  BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:-}
  BILLING_PRICES: ${BILLING_PRICES:-}
  BILLING_CHECKOUT_URLS: ${BILLING_CHECKOUT_URLS:-}
  BILLING_MANAGE_URL: ${BILLING_MANAGE_URL:-}
  BILLING_PADDLE_CLIENT_TOKEN: ${BILLING_PADDLE_CLIENT_TOKEN:-}
  BILLING_PADDLE_ENVIRONMENT: ${BILLING_PADDLE_ENVIRONMENT:-}
  BILLING_PADDLE_API_KEY: ${BILLING_PADDLE_API_KEY:-}

services:
  # HTTPS for the public names (app, storage, LiveKit, TURN), certificates from Let's Encrypt.
  # Built with the layer4 plugin: port 443 also carries TURN over TLS (see Caddyfile).
  # Host networking (like LiveKit): it listens on the server's 80/443 and reaches the other
  # services on 127.0.0.1.
  caddy:
    build:
      context: ../..
      dockerfile: deploy/docker/caddy.Dockerfile
    image: ${TAPRY_IMAGES:-tapry}/tapry-caddy:${TAPRY_VERSION:-local}
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
      PUBLIC_SCHEME: ${PUBLIC_SCHEME:-https}
      ACME_EMAIL: ${ACME_EMAIL:-noreply@localhost}
    volumes:
      - ${CADDYFILE:-./Caddyfile}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  # Studio UI + API. Queues processing jobs; the worker service below does the work.
  # Published on loopback only: the outside world reaches it through Caddy.
  web:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args:
        TAPRY_VERSION: ${TAPRY_VERSION:-local}
    image: ${TAPRY_IMAGES:-tapry}/tapry-web:${TAPRY_VERSION:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      <<: *app-env
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      # The first account must enter this code (setup.sh writes one); empty: anyone who gets there first.
      SETUP_TOKEN: ${SETUP_TOKEN:-}
      # Other sites allowed to use the public upload-speed test (comma-separated origins).
      SPEED_TEST_ORIGINS: ${SPEED_TEST_ORIGINS:-}
      # The project website's origins (Tapry Cloud): it may ask whether a visitor is signed in and post to the waitlist.
      SITE_ORIGINS: ${SITE_ORIGINS:-}
      # GitHub "owner/name" whose latest release the health page compares with; empty: no check.
      UPDATE_CHECK_REPO: ${UPDATE_CHECK_REPO:-}
      LIVEKIT_URL: ${LIVEKIT_WS_SCHEME:-wss}://livekit.${DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?}
      # Recordings are processed by the worker service below; the web app only queues jobs.
      WORKER: "off"
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Processes and transcribes recordings (same image, other entry point). Scale with
  # WORKER_REPLICAS=n; workers share the queue safely, a stopped one hands its job back.
  worker:
    image: ${TAPRY_IMAGES:-tapry}/tapry-web:${TAPRY_VERSION:-local}
    restart: unless-stopped
    command: ["node", "worker.cjs"]
    environment:
      <<: *app-env
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    # Long enough to hand a running job back cleanly.
    stop_grace_period: 30s
    healthcheck:
      # The worker writes a heartbeat after every poll; stale means stuck.
      test: ["CMD", "node", "-e", "process.exit(Date.now() - Number(require('fs').readFileSync('/tmp/tapry-worker-heartbeat', 'utf8')) < 60000 ? 0 : 1)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 30s
    depends_on:
      # The web app runs migrations first (workers would also wait on the migration lock).
      web:
        condition: service_healthy

  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATA_NAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${DATA_NAME}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATA_NAME} -d ${DATA_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  # S3-compatible storage for recordings (docs/decisions/0002). Any S3 works instead:
  # remove this service and point S3_* in the web service at it.
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    restart: unless-stopped
    ports:
      - "127.0.0.1:8333:8333"
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        printf '{"identities":[{"name":"tapry","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' \
          "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json
        exec weed server -dir=/data -s3 -s3.port=8333 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8333"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Live call. Media goes over UDP 7882 directly when it can; otherwise TCP 7881, then TURN:
  # UDP 3478, or TLS on 443 (through Caddy) for networks that only allow HTTPS.
  # Host networking, as LiveKit recommends: its built-in TURN relays to LiveKit's own media
  # port, which only works when LiveKit sends from the address it advertises. Under Docker's
  # default bridge network it sends from the container's address and the relay drops it.
  livekit:
    image: livekit/livekit-server:v1.13.11
    restart: unless-stopped
    network_mode: host
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?}: ${LIVEKIT_API_SECRET:?}"
      LIVEKIT_CONFIG: |
        port: 7880
        # Signalling only via Caddy (wss://livekit.<domain>), not on the public interface.
        bind_addresses: ["127.0.0.1"]
        rtc:
          tcp_port: 7881
          udp_port: 7882
          # Public servers: discover the public IP. setup.sh localhost: advertise 127.0.0.1.
          use_external_ip: ${LIVEKIT_USE_EXTERNAL_IP:-true}
          node_ip: "${LIVEKIT_NODE_IP:-}"
          # Don't send media from Docker's own bridge addresses (or private IPv6): they aren't
          # the address LiveKit advertises, so TURN would drop what's relayed from them.
          ips:
            excludes: ["172.16.0.0/12", "fd00::/8"]
        turn:
          enabled: true
          domain: turn.${DOMAIN}
          # TLS is terminated by Caddy on 443; LiveKit tells browsers turns:turn.<domain>:443.
          tls_port: 5349
          external_tls: true
          udp_port: ${LIVEKIT_TURN_UDP_PORT:-3478}
          # TURN never relays to private/loopback addresses (no reaching into internal networks),
          # except these. Empty on public servers; setup.sh localhost allows only 127.0.0.1, where
          # LiveKit's own media port is.
          allow_restricted_peer_cidrs: [${LIVEKIT_TURN_ALLOW_PEERS:-}]
        logging:
          level: ${LIVEKIT_LOG_LEVEL:-info}
          pion_level: ${LIVEKIT_PION_LOG_LEVEL:-error}


volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  seaweedfs-data:
